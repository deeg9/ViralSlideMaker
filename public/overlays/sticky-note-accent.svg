<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <!--
    Phase 57 (D-15, PALETTE-03): tintable sticky-note SVG.
    Main note body uses fill="currentColor" so the renderDecorativeOverlay
    `tintColor` arg controls the accent (CSS `color` injects via inline style).
    Inner ink lines stay black so legibility is preserved on any tint.
  -->
  <g transform="rotate(-3 120 120)">
    <!-- Drop shadow -->
    <rect x="22" y="26" width="200" height="200" fill="rgba(0,0,0,0.18)" />
    <!-- Main body — TINTED via currentColor -->
    <rect x="20" y="20" width="200" height="200" fill="currentColor" />
    <!-- Top edge highlight (subtle) -->
    <rect x="20" y="20" width="200" height="6" fill="rgba(255,255,255,0.25)" />
    <!-- Ink scribbles (fixed black, AA contrast on most tints) -->
    <line x1="40" y1="70" x2="200" y2="70" stroke="rgba(0,0,0,0.45)" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="100" x2="180" y2="100" stroke="rgba(0,0,0,0.45)" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="130" x2="190" y2="130" stroke="rgba(0,0,0,0.45)" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="160" x2="160" y2="160" stroke="rgba(0,0,0,0.45)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
